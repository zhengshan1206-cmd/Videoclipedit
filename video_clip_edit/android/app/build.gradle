def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/key/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    packagingOptions {
        exclude 'META-INF/services/javax.annotation.processing.Processor'
        // 明确排除其他架构的 so 文件，只保留 arm64-v8a
        exclude 'lib/armeabi/**'
        exclude 'lib/armeabi-v7a/**'
        exclude 'lib/x86/**'
        exclude 'lib/x86_64/**'
        exclude 'lib/mips/**'
        exclude 'lib/mips64/**'
    }

    namespace = "com.yinxiaozhi.fastscreen"
    compileSdk = compileSdkVer
    ndkVersion = flutter.ndkVersion

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "beiyin.subtletypen.com"
        minSdk = minSdkVer
        targetSdk = targetSdkVer
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true

        buildConfigField("String", "bugly_key", "\"\"")
        buildConfigField("String", "appKey", "\"${appKey}\"")
        buildConfigField("String", "appSecret", "\"${appSecret}\"")
        buildConfigField("String", "licenseKey", "\"${licenseKey}\"")

        buildConfigField("String", "ROOT_URL", "\"${ROOT_URL}\"")
        buildConfigField("String", "OSS_ROOT", "\"${OSS_ROOT}\"")
        buildConfigField("String", "PRIVATE_CLOUD_URL", "\"${PRIVATE_CLOUD_URL}\"")
        buildConfigField("String", "PRIVATE_CLOUD_KEY", "\"${PRIVATE_CLOUD_KEY}\"")

        ndk {
            abiFilters  'arm64-v8a'
//           abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
//            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'

        }

        manifestPlaceholders = [
            UMENG_APPKEY: '67ea471a65c707471a351878',
            UMENG_MESSAGE_SECRET: '8a08b54d6c44047eae016bcf9ff21e22',
            UMENG_CHANNEL: 'Dev',

            HONOR_APP_ID: '104430784',

            HUAWEI_APP_ID: '110344295',

            XIAOMI_APP_ID: '2882303761520295621',
            XIAOMI_APP_KEY: '5182029540621',

            VIVO_APP_ID: '105721284',
            VIVO_APP_KEY: 'acdbbe8b04868a3dcf4bfa6c5c437040',

            MEIZU_APP_ID: '116090',
            MEIZU_APP_KEY: '9413f9968d654df092afecf4d3782391',

            OPPO_APP_KEY: '4fc7cc9640c94287ad85247970449343',
            OPPO_APP_SECRET: '23310d3afd4d408283b849fabe73df0f',
        ]
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    dexOptions {
        preDexLibraries = false
        jumboMode true
        javaMaxHeapSize "4096m"
    }

    lintOptions {
        disable 'MissingTranslation'
        disable "ResourceType"
        abortOnError false
    }

    aaptOptions {
        noCompress "tflite"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                def date = new Date()
                def formattedDate = date.format('yyMMddHHmm')
                outputFileName = "${/*keystoreProperties['appName']*/"妙笔工坊"}-${defaultConfig.versionName}-${defaultConfig.versionCode}-${variant.buildType.name}.apk"
            }
    }
//    packagingOptions{
//        doNotStrip "*/x86_64/*.so"
//    }
}

flutter {
    source = "../.."
}

configurations.all {
    // 排除 umeng_push_sdk 中的旧版本 HTTPDNS，避免与 aliyun_httpdns 插件冲突
    // 只影响传递依赖，不影响其他功能
    exclude group: 'com.umeng.umsdk', module: 'alicloud-httpdns'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    // 添加 core-ktx 以支持 photo_manager 插件的 toUri 扩展方法
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // 友盟推送 SDK 依赖（确保 MainActivity 和 MyApplication 可以访问友盟类）
    // 使用 api 而不是 implementation，确保依赖传递
    api 'com.umeng.umsdk:common:9.6.8'
    api 'com.umeng.umsdk:asms:1.8.2'
    api 'com.umeng.umsdk:push:6.6.3'
    
//    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation ('com.github.gzu-liyujiang:Android_CN_OAID:4.2.8'){
//        // 如果使用了移动安全联盟SDK，共存的话需排除掉本项目依赖的华为/荣耀官方广告标识服务SDK，因为移动安全联盟SDK也依赖了华为/荣耀的SDK
//        // 如果华为官方广告标识服务SDK下载失败或编译报错的话，可考虑在 build.gradle 中增加以下配置：
//        // repositories { maven { url 'https://developer.huawei.com/repo' } }
//         runtimeOnly "com.huawei.hms:ads-identifier:3.4.62.300"
//        exclude group: 'com.huawei.hms', module: 'ads-identifier'
//        // 荣耀官方广告标识服务SDK同理：
//         repositories { maven { url 'https://developer.hihonor.com/repo' } }
//         runtimeOnly "com.hihonor.mcs:ads-identifier:1.0.2.301"
        exclude group: 'com.hihonor.mcs', module: 'ads-identifier'
    }
    implementation 'com.huawei.hms:ads-identifier:3.4.62.300'
    implementation 'com.hihonor.mcs:ads-identifier:1.0.2.301'
    // 巨量归因 SDK（Maven 接入，替代本地 AAR）
    implementation 'com.bytedance.ads:AppConvert:2.0.4'
//    implementation 'com.tencent.bugly:crashreport:4.1.9'
//    implementation 'com.tencent.bugly:nativecrashreport:3.9.2'
//    kapt "com.github.bumptech.glide:compiler:${glide_version}"
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

